[package]
name = "inky"
version = "0.1.0"
description = "Inky — a pleasant markdown reader and editor"
authors = ["Vidal Eliason"]
edition = "2021"

[lib]
name = "inky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
base64 = "0.23.1"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-window-state = "2.4.1"
rmcp = { version = "3.2", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util"] }
tokio-util = "0.7"
schemars = "1"
dirs = "6"
notify-debouncer-mini = "0.7"

[dev-dependencies]
rmcp = { version = "3.2", features = ["client"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", features = [
    "NSPrintInfo",
    "NSPrintOperation",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-web-kit = { version = "0.3", features = [
    "objc2-app-kit",
    "block2",
    "WKWebView",
] }
